<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        html {
            filter: invert(1);
        }
        body {
            font-family: 'Consolas', sans-serif;
            font-size: 12pt;
            letter-spacing: 0px;
            margin: 0px;
            padding: 0;
            background-color: white;
            color: black;
            height: 100dvh;
        }
    </style>
</head>
<body>

<script type="module">
    import {LitElement, html, render} from 'https://cdn.jsdelivr.net/gh/lit/dist@3/all/lit-all.min.js';
    import {greet} from "./foo.js";
    function myTemplate(name) {
        return html`${greet()} ${name}`;
    }

    render(myTemplate('World'), document.body);
</script>
</body>
</html>
