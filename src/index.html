<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark" />
    <title>Title</title>
    <style>
        body {
            height: 100dvh;
        }
        * {
            font-family: 'Consolas', sans-serif;
            font-size: 12pt;
            letter-spacing: 0px;
            margin: 0px;
            padding: 0px;
        }
        [contenteditable]:focus {
            outline: none;
        }
    </style>
</head>
<body>
<pre id="app"></pre>
<div id="log"></div>
<script type="module">
    import {LitElement, html, render} from 'https://cdn.jsdelivr.net/gh/lit/dist@3/all/lit-all.min.js';
    import {greet, setCursorToEnd} from "./foo.js";

    function myTemplate() {
        return html`<div id="cursor"
                         style="display: inline-block; caret-shape: block; min-width: 1ch; padding-left: 1px; border: 1px solid white"
                         contenteditable="plaintext-only"></div>`;
    }

    render(myTemplate(), app);
    setCursorToEnd(cursor)

    cursor.addEventListener("input",()=>{
        const txt = cursor.textContent
        console.log(txt)
        if (cursor.textContent === "\n") {
            debugger

            cursor.innerHTML=""
            return
        }
        const fragment = document.createDocumentFragment();
        const chars = [...txt]
        const spans = chars.map(c=>html`<span>${c}</span>`)
        const h =html`${spans}`
        render(h,fragment)
        removeCommentsFromFragment(fragment)
        cursor.before(fragment)
        cursor.innerHTML=""
    })

    cursor.addEventListener('keydown', keydown);

    function keydown(e) {
        var k = e.key
        if (k==="Control" || k==="Alt" || k==="Shift") return
        if (e.ctrlKey) {
            k="Control+"+k
        }
        console.log(k)

        if (k === "Backspace") {
            var sib = cursor.previousElementSibling
            if (!sib) {
                return;
            }
            sib.remove()
        }
        else if (k === "Delete") {
            var sib = cursor.nextElementSibling
            if (!sib) {
                return;
            }
            sib.remove()
        }
        else if (k === "ArrowLeft") {
            var sib = cursor.previousElementSibling
            if (!sib) {
                return;
            }
            sib.before(cursor)
            setCursorToEnd(cursor)
        }
        else if (k === "ArrowRight") {
            var sib = cursor.nextElementSibling
            if (!sib) {
                return;
            }
            sib.after(cursor)
            setCursorToEnd(cursor)
        } else if (k === "Control+Enter") {

        } else if (k==="Enter") {
            var el = document.createElement("br")
            cursor.before(el)
            e.preventDefault()
        }
    }
    function removeCommentsFromFragment(fragment) {
        const walker = document.createTreeWalker(
            fragment,
            NodeFilter.SHOW_COMMENT,
            null
        );

        const commentNodes = [];
        while (walker.nextNode()) {
            commentNodes.push(walker.currentNode);
        }

        commentNodes.forEach(node => node.parentNode.removeChild(node));
        return fragment;
    }
</script>
</body>
</html>
